name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
          cache-dependency-path: sdk/go/go.mod
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - run: npm ci && npm audit --audit-level=high
        working-directory: sdk/typescript
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && govulncheck ./...
        working-directory: sdk/go
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
        working-directory: sdk/rust
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          path: ./
          extra_args: --only-verified
