name: release
on:
  push:
    tags: ['v1.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v1 tag to rebuild and publish
        required: true
        type: string
      reuse_run_id:
        description: Prior release run whose exact-tag artifacts should be published
        required: false
        default: ''
        type: string
permissions:
  contents: read
env:
  KUJO_COMMIT: 67e880a9688dd5770d4a67311d45aa551e6a6fd6
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
  runtime-bundles:
    if: ${{ inputs.reuse_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          path: searchbridge
          ref: ${{ env.RELEASE_REF }}
      - name: Validate immutable v1 release tag
        shell: bash
        working-directory: searchbridge
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Install Windows OpenSSL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build exact tagged Kujo runtime
        working-directory: searchbridge
        run: cargo build --release --locked --manifest-path ../kujo/Cargo.toml
      - name: Build exact tagged runtime bundle twice
        shell: bash
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ runner.os == 'Windows' && format('{0}/kujo/target/release/kujo.exe', github.workspace) || format('{0}/kujo/target/release/kujo', github.workspace) }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_REF")"
          first="$(KUJO_COMMIT="$KUJO_COMMIT" bash scripts/build_runtime_bundle.sh '${{ matrix.platform }}')"
          first_hash="$(bash scripts/sha256.sh "$first" | awk '{print $1}')"
          second="$(KUJO_COMMIT="$KUJO_COMMIT" bash scripts/build_runtime_bundle.sh '${{ matrix.platform }}')"
          second_hash="$(bash scripts/sha256.sh "$second" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          (cd "$(dirname "$second")" && bash "$PWD/../../scripts/sha256.sh" --check "$(basename "$second").sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-runtime-${{ matrix.platform }}
          path: searchbridge/dist/runtime/*
          if-no-files-found: error

  metadata-and-sdks:
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - name: Validate immutable v1 release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: sdk/go/go.mod
      - name: Verify tag and build SDK, source, SBOM, and provenance artifacts
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: |
          set -euo pipefail
          release_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "v$(tr -d '\r\n' < VERSION)" = "$RELEASE_REF"
          cargo build --release --locked --manifest-path .runtime/kujo/Cargo.toml
          bash scripts/validate.sh
          bash scripts/package_sdks.sh
          "$KUJO_BIN" run scripts/release_artifacts.kujo
          git archive --format=tar.gz --prefix="searchbridge-${RELEASE_REF#v}/" -o "dist/searchbridge-${RELEASE_REF#v}.tar.gz" "$release_sha"
          git archive --format=zip --prefix="searchbridge-${RELEASE_REF#v}/" -o "dist/searchbridge-${RELEASE_REF#v}.zip" "$release_sha"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-metadata-sdks
          path: dist
          if-no-files-found: error

  publish:
    needs: [runtime-bundles, metadata-and-sdks]
    if: ${{ always() && vars.SEARCHBRIDGE_PUBLIC_RELEASE_APPROVED == 'true' && (inputs.reuse_run_id != '' || (needs.runtime-bundles.result == 'success' && needs.metadata-and-sdks.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - name: Validate release source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v1\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
          test "v$(tr -d '\r\n' < VERSION)" = "$RELEASE_REF"
          if [[ -n "$REUSE_RUN_ID" ]]; then
            [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
            workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)"
            run_identity="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq '[.workflow_id, .event, .head_branch] | @tsv')"
            test "$run_identity" = "$(printf '%s\tworkflow_dispatch\tmain' "$workflow_id")"
            artifact_names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false) | .name] | sort | join("\n")')"
            expected_names="$(printf '%s\n' release-metadata-sdks release-runtime-linux-x64 release-runtime-macos-arm64 release-runtime-macos-x64 release-runtime-windows-x64)"
            test "$artifact_names" = "$expected_names"
          fi
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify aggregate release set
        run: |
          set -euo pipefail
          cd dist
          version="${RELEASE_REF#v}"
          if [[ -d sdk ]]; then
            mv "sdk/kujolang-searchbridge-$version.tgz" .
            mv "sdk/searchbridge-$version.crate" .
            mv "sdk/searchbridge-go-$version.tar.gz" .
            mv sdk/provenance.json "searchbridge-sdk-$version.provenance.json"
            mv sdk/SHA256SUMS "searchbridge-sdk-$version-SHA256SUMS"
            rmdir sdk
          fi
          for required in \
            "searchbridge-$version-linux-x64.tar.gz" \
            "searchbridge-$version-macos-arm64.tar.gz" \
            "searchbridge-$version-macos-x64.tar.gz" \
            "searchbridge-$version-windows-x64.tar.gz" \
            "searchbridge-$version.tar.gz" \
            "searchbridge-$version.zip" \
            "searchbridge-$version.spdx.json" \
            "searchbridge-$version.provenance.json" \
            "kujolang-searchbridge-$version.tgz" \
            "searchbridge-$version.crate" \
            "searchbridge-go-$version.tar.gz" \
            "searchbridge-sdk-$version.provenance.json" \
            "searchbridge-sdk-$version-SHA256SUMS"; do
            test -s "$required"
          done
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'dist/*'
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
