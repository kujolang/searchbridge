name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  KUJO_COMMIT: 67e880a9688dd5770d4a67311d45aa551e6a6fd6
jobs:
  kujo-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.25'
          cache-dependency-path: sdk/go/go.mod
      - name: Build pinned Kujo runtime
        run: cargo build --release --locked --manifest-path .runtime/kujo/Cargo.toml
      - name: Validate
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: bash scripts/validate.sh
