name: sdk-compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: 05fe4c382296b716a9a5e31d137d1880b4a6b807
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
      - run: cargo build --release --manifest-path .runtime/kujo/Cargo.toml
      - name: Prove generated SDK sources are current
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: |
          "$KUJO_BIN" run scripts/generate_sdk_types.kujo
          git diff --exit-code -- sdk
          "$KUJO_BIN" run scripts/sdk_compatibility_gate.kujo
      - run: npm install --ignore-scripts && npm run check
        working-directory: sdk/typescript
      - run: cargo check --locked
        working-directory: sdk/rust
      - run: go test ./...
        working-directory: sdk/go
