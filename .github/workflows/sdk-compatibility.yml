name: sdk-compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generated-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kujolang/kujo
          ref: 67e880a9688dd5770d4a67311d45aa551e6a6fd6
          path: .runtime/kujo
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.23'
      - run: cargo build --release --manifest-path .runtime/kujo/Cargo.toml
      - name: Prove generated SDK sources are current
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
        run: |
          "$KUJO_BIN" run scripts/generate_sdk_types.kujo
          git diff --exit-code -- sdk
          "$KUJO_BIN" run scripts/sdk_compatibility_gate.kujo
      - run: npm install --ignore-scripts && npm run check
        working-directory: sdk/typescript
      - run: cargo check --locked
        working-directory: sdk/rust
      - run: go test ./...
        working-directory: sdk/go
        env:
          KUJO_BIN: ${{ github.workspace }}/.runtime/kujo/target/release/kujo
