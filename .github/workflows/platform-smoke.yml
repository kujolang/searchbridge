name: platform-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  KUJO_COMMIT: 4463678d1badeb4ccff3f6cca8d052b9360f40c0
jobs:
  launcher-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: searchbridge
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Install Windows OpenSSL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo build --release --manifest-path kujo/Cargo.toml
      - name: POSIX launcher and package smoke
        if: runner.os != 'Windows'
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: |
          ./searchbridge version
          ./searchbridge analytics --fixture --offline --deterministic
          archive="${RUNNER_TEMP}/searchbridge.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          test -s "$archive"
      - name: Windows launcher and package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ github.workspace }}\kujo\target\release\kujo.exe
        run: |
          .\searchbridge.ps1 version
          .\searchbridge.ps1 analytics --fixture --offline --deterministic
          Compress-Archive -Path * -DestinationPath "$env:RUNNER_TEMP\searchbridge.zip"
          if (-not (Test-Path "$env:RUNNER_TEMP\searchbridge.zip")) { exit 1 }
