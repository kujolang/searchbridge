name: platform-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  KUJO_COMMIT: 67e880a9688dd5770d4a67311d45aa551e6a6fd6
jobs:
  launcher-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: searchbridge
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: kujolang/kujo
          ref: ${{ env.KUJO_COMMIT }}
          path: kujo
      - uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: stable
      - name: Install Windows OpenSSL dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo build --release --manifest-path kujo/Cargo.toml
      - name: POSIX launcher and package smoke
        if: runner.os != 'Windows'
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ github.workspace }}/kujo/target/release/kujo
        run: |
          ./searchbridge version
          ./searchbridge analytics --fixture --offline --deterministic
          archive="${RUNNER_TEMP}/searchbridge.tar.gz"
          git archive --format=tar.gz --output="$archive" HEAD
          test -s "$archive"
      - name: Build reproducible self-contained bundle
        shell: bash
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ runner.os == 'Windows' && format('{0}/kujo/target/release/kujo.exe', github.workspace) || format('{0}/kujo/target/release/kujo', github.workspace) }}
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux-x64 ;;
            macOS-X64) platform=macos-x64 ;;
            macOS-ARM64) platform=macos-arm64 ;;
            Windows-X64) platform=windows-x64 ;;
            *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          archive="$(bash scripts/build_runtime_bundle.sh "$platform")"
          first="$(bash scripts/sha256.sh "$archive" | awk '{print $1}')"
          archive="$(bash scripts/build_runtime_bundle.sh "$platform")"
          second="$(bash scripts/sha256.sh "$archive" | awk '{print $1}')"
          test "$first" = "$second"
          checker="$PWD/scripts/sha256.sh"
          (cd "$(dirname "$archive")" && bash "$checker" --check "$(basename "$archive").sha256")
          echo "BUNDLE_PATH=${archive#$PWD/}" >> "$GITHUB_ENV"
      - name: Offline POSIX bundle smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          install_dir="${RUNNER_TEMP}/searchbridge-offline"
          mkdir -p "$install_dir"
          tar -xzf "searchbridge/${BUNDLE_PATH}" -C "$install_dir"
          env -i PATH="$PATH" "$install_dir/searchbridge-0.4.0/searchbridge" analytics --fixture --offline --deterministic
      - name: Offline Windows bundle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Install = Join-Path $env:RUNNER_TEMP "searchbridge-offline"
          New-Item -ItemType Directory -Force -Path $Install | Out-Null
          tar -xzf (Join-Path "searchbridge" $env:BUNDLE_PATH) -C $Install
          & (Join-Path $Install "searchbridge-0.4.0\searchbridge.ps1") analytics --fixture --offline --deterministic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-bundle-${{ runner.os }}-${{ runner.arch }}
          path: |
            searchbridge/${{ env.BUNDLE_PATH }}
            searchbridge/${{ env.BUNDLE_PATH }}.sha256
          retention-days: 30
      - name: Windows launcher and package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: searchbridge
        env:
          KUJO_BIN: ${{ github.workspace }}\kujo\target\release\kujo.exe
        run: |
          .\searchbridge.ps1 version
          .\searchbridge.ps1 analytics --fixture --offline --deterministic
          Compress-Archive -Path * -DestinationPath "$env:RUNNER_TEMP\searchbridge.zip"
          if (-not (Test-Path "$env:RUNNER_TEMP\searchbridge.zip")) { exit 1 }
